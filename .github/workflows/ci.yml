name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # pytest matrix — every test EXCEPT the Docker-dependent ones.
  # test_isolation.py + test_mfa.py::TestMFAGatewayE2E run in
  # `e2e-docker` below because they need the compose fabric.
  # ------------------------------------------------------------------
  test:
    name: pytest (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          # Ratchet: build fails if coverage drops below this. Bump
          # in the same PR that adds new tests.
          MIN_COVERAGE: "70"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_isolation.py \
            -k 'not TestMFAGatewayE2E' \
            --cov=plenith \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${MIN_COVERAGE}
        shell: bash

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Fast lint gate; runs in parallel with the test matrix. Ruff
  # catches the real-defect categories (unused imports, undefined
  # names, common bug patterns) and enforces import order. Format
  # check is non-fixing here — local pre-commit applies the fix.
  # ------------------------------------------------------------------
  lint:
    name: lint (ruff + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile-check every .py
        run: python -m compileall -q plenith tools tests linux-fork
      - name: ruff lint (defect-catchers only)
        # Initial scope is intentionally narrow — see ruff.toml for the
        # active rule set and the roadmap to widen it.
        run: ruff check .
      - name: ruff format check (advisory)
        # Format-on-save discipline is enforced via pre-commit, not CI.
        # We still report the count for visibility.
        continue-on-error: true
        run: ruff format --check . || true

  # ------------------------------------------------------------------
  # Build the three docker images. Catches Dockerfile regressions
  # (missing COPY paths, image-base issues) without the full fabric.
  # ------------------------------------------------------------------
  docker-build:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: linux-fork/agent/Dockerfile
          push: false
          tags: plenith/agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mfa-gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: linux-fork/mfa/Dockerfile
          push: false
          tags: plenith/mfa-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build push-sim image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: linux-fork/mfa/push-sim.Dockerfile
          push: false
          tags: plenith/push-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # E2E: bring up the locked-down fabric, run the 18-probe isolation
  # validation + live MFA gateway test.
  # ------------------------------------------------------------------
  e2e-docker:
    name: docker compose end-to-end
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build images locally
        run: |
          docker build -f linux-fork/agent/Dockerfile          -t plenith/agent:0.1 .
          docker build -f linux-fork/mfa/Dockerfile            -t plenith/mfa-gateway:0.1 .
          docker build -f linux-fork/mfa/push-sim.Dockerfile   -t plenith/push-sim:0.1 .

      - name: Bring up the fabric
        working-directory: linux-fork
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          echo "PLENITH_DEPLOYMENT_ID=ci-test-${GITHUB_RUN_ID}" >> .env
          docker compose up -d
          sleep 10
          docker ps

      - name: Run isolation + MFA E2E tests
        run: |
          python -m pytest tests/test_isolation.py tests/test_mfa.py -v
        timeout-minutes: 5

      - name: Capture logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in plenith-dns plenith-llm-egress mfa-gateway \
                    push-sim plenith-proxy bastion-prod db-prod-01; do
            echo "===== $c ====="
            docker logs $c 2>&1 | tail -80 || true
          done

      - name: Tear down
        if: always()
        working-directory: linux-fork
        run: docker compose down --remove-orphans
