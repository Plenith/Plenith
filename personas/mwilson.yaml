username: mwilson
full_name: Morgan Wilson
title: Incident Response / Detection Engineer
department: Security Operations
hostname: corp-app01
home: /home/mwilson
shell: /bin/bash
os_release: |
  NAME="Ubuntu"
  VERSION="22.04.4 LTS (Jammy Jellyfish)"
  ID=ubuntu
  VERSION_ID="22.04"
uname: "Linux corp-app01 5.15.0-105-generic #115-Ubuntu SMP Mon Apr 15 09:52:04 UTC 2024 x86_64 x86_64 x86_64 GNU/Linux"
id_output: "uid=1003(mwilson) gid=1003(mwilson) groups=1003(mwilson),27(sudo),4(adm),998(docker),117(ssh)"
groups: [mwilson, sudo, adm, docker, ssh]
home_listing:
  - .bashrc
  - .bash_history
  - .profile
  - .ssh
  - .aws
  - .gnupg
  - detections
  - playbooks
  - osquery
  - hunts
recent_projects:
  - sigma-rules
  - osquery-fleet
  - incident-2026-04-payments-c2
notes: |
  Morgan is on the detection-engineering side of SecOps. They write Sigma + Elastic
  rules, run osquery hunts, triage PagerDuty alerts, and SSH into "siem-prod" and
  "edr-prod" for log review. They keep PGP keys in ~/.gnupg, hunt notes under
  ~/hunts, and Sigma playbooks under ~/playbooks.
bash_history_pool:
  - "tail -f /var/log/auth.log"
  - "journalctl -u sshd --since '15 min ago'"
  - "grep -i 'Accepted' /var/log/auth.log | tail -20"
  - "cd ~/detections"
  - "vim sigma/credential_access/aws_credentials_read.yml"
  - "git pull"
  - "git log --oneline -20"
  - "git checkout -b hunt/payments-c2-2026-04"
  - "osqueryi --json"
  - "osqueryi 'SELECT pid, name, cmdline FROM processes WHERE name LIKE \"%curl%\";'"
  - "ssh siem-prod"
  - "ssh edr-prod"
  - "ssh hunt-jumpbox"
  - "curl -s https://api.virustotal.com/api/v3/files/abc..."
  - "openssl x509 -in cert.pem -noout -text"
  - "gpg --verify advisory.sig advisory.txt"
  - "gpg --list-keys"
  - "yara -r rules/ /var/log/"
  - "strings -a /tmp/sample.bin | head"
  - "file /tmp/sample.bin"
  - "sha256sum /tmp/sample.bin"
  - "tcpdump -i eth0 -w /tmp/capture.pcap port 4444"
  - "tshark -r /tmp/capture.pcap -Y http.request"
  - "vim hunts/aws-credentials-exfil.md"
  - "kubectl logs -n monitoring falco-xyz | tail -100"
  - "cat ~/playbooks/IR-cred-exfil.md"
  - "history -d 12"
  - "history"
  - "exit"
