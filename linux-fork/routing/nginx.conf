user nobody;
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# We use the `stream` block (not `http`) because SSH is a raw TCP protocol.
# Lua-on-stream hooks via `preread_by_lua_file` lets us inspect the source
# IP at TCP-connect time and decide which upstream pool to proxy to.
stream {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared dictionaries — seed populated by init.lua. Must be declared
    # before init_by_lua_file runs.
    lua_shared_dict plenith_geo   10m;
    lua_shared_dict plenith_rep   10m;
    lua_shared_dict plenith_rates 10m;

    init_by_lua_file /etc/nginx/lua/init.lua;

    # ------------------------------------------------------------------
    # Upstream pools. In production these would point at real backends;
    # for the lab `real-prod-stub` and `mfa-stub` are dummy containers
    # that just announce who they are when probed.
    # ------------------------------------------------------------------
    # ---------------------------------------------------------------
    # Backends listen on port 2200 for PROXY-prefixed traffic and on
    # port 22 for plain SSH (lateral movement inside the bubble). The
    # proxy talks to :2200 with `proxy_protocol on;` so every backend
    # learns the ORIGINAL client IP for engagement state keying and
    # MFA decision-file matching. Lateral SSH between agents stays on
    # :22 and bypasses PROXY parsing entirely.
    # ---------------------------------------------------------------
    upstream real_prod_pool {
        server real-prod-stub:2200;
    }
    upstream mfa_relay_pool {
        # The real MFA step-up gateway — TOTP challenge + decision-file
        # handoff. See linux-fork/mfa/mfa_gateway.py and the §4.3 flow
        # in routing/ROUTING_SPEC.md.
        server mfa-gateway:2200;
    }
    upstream plenith_pool {
        server bastion-prod:2200;
    }

    # Map a Lua-set variable to an upstream pool. Stream upstream selection
    # has to go through a variable + `map` (you can't `proxy_pass` to a
    # variable directly in stream mode).
    map $plenith_pool $resolved_upstream {
        default        plenith_pool;
        real_prod      real_prod_pool;
        mfa_relay      mfa_relay_pool;
        plenith     plenith_pool;
    }

    server {
        listen 22;

        # Set the routing variable for the map above.
        set $plenith_pool "plenith";

        preread_by_lua_file /etc/nginx/lua/score_and_route.lua;

        # `proxy_protocol on;` prepends a CRLF-terminated PROXY v1
        # header naming the original client IP to every outbound
        # connection. All three upstream pools target :2200 on their
        # respective backend, where a PROXY-stripping listener parses
        # the header before letting asyncssh have the socket.
        proxy_protocol      on;
        proxy_pass          $resolved_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout       1h;
    }
}
