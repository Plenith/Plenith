################################################################################
# LLM egress bridge.
#
# This nginx sits in BOTH the bridge_net (where it can reach LM Studio on
# the Windows host via host.docker.internal:1234) AND the decoy_net (where
# it serves agents under the alias `llm.internal`). It is the only
# audited path out of the isolation bubble.
#
# Without this bridge, agents on an `internal: true` Docker network would
# have no way to call the LLM at all — host.docker.internal stops working
# the moment we drop the agent's bridge gateway.
#
# Production note: in §4.2 this is a reverse-proxy to the on-prem Ollama
# node, not to a Windows host. The Lua-driven proxy header rewriting and
# request shaping is identical.
################################################################################

events {
    worker_connections 256;
}

http {
    access_log /var/log/nginx/llm-access.log;
    error_log  /var/log/nginx/llm-error.log warn;

    # Reasonable defaults for LLM workloads — long-lived streams, large
    # response bodies (model output), no compression rewriting.
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;

    # Resolver for `host.docker.internal` — Docker's internal resolver
    # lives at 127.0.0.11 and is reachable from any non-internal bridge.
    # Cache for 30s; if the host gateway IP changes (rare), we re-resolve.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Reject anything other than the OpenAI-compatible API surface. This
    # is "audited egress" — the only request shapes allowed are the ones
    # LM Studio actually exposes. Attackers who somehow get a foothold
    # in an agent can't repurpose this bridge for arbitrary egress.
    map $request_uri $is_allowed {
        default                 0;
        "~^/v1/models"           1;
        "~^/v1/chat/completions" 1;
        "~^/v1/completions"      1;
        "~^/v1/embeddings"       1;
    }

    server {
        listen 1234;
        server_name llm.internal;

        # Block unknown URIs at the edge before any host header rewriting.
        if ($is_allowed = 0) {
            return 403;
        }

        # The `set $upstream` indirection forces re-resolution per request
        # via the resolver above — we don't want a stale gateway IP cached
        # for the lifetime of the worker.
        location / {
            set $upstream "host.docker.internal:1234";
            proxy_pass         http://$upstream;
            proxy_set_header   Host $upstream;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
